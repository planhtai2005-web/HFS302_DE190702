<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('Thêm sản phẩm')}"></th:block>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar('sanpham')}"></nav>

<main class="container py-4">
    <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

    <h1 class="h3 mb-3">Thêm sản phẩm</h1>

    <form th:action="@{/sanpham/them}"
          th:object="${sanPham}"
          method="post"
          class="card card-body shadow-sm">

        <div class="mb-3">
            <label for="ten" class="form-label">Tên sản phẩm</label>
            <input type="text"
                   id="ten"
                   class="form-control"
                   th:field="*{ten}"
                   required>
        </div>

        <div class="mb-3">
            <label for="gia" class="form-label">Giá</label>
            <input type="number"
                   id="gia"
                   class="form-control"
                   th:field="*{gia}"
                   min="0"
                   step="0.01"
                   required>
        </div>

        <div class="mb-3">
            <label for="soLuong" class="form-label">Số lượng</label>
            <input type="number"
                   id="soLuong"
                   class="form-control"
                   th:field="*{soLuong}"
                   min="0"
                   required>
        </div>

        <button type="submit" class="btn btn-primary">
            Thêm sản phẩm
        </button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
