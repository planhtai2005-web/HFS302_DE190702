
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Chi tiết sinh viên</title>
</head>
<body>
<section layout:fragment="content">
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0"
                th:text="|${student.studentCode} - ${student.fullName}|">
                SE180001 - Nguyễn Văn A
            </h4>

            <span class="badge"
                  th:classappend="${student.active} ? ' text-bg-success' : ' text-bg-secondary'"
                  th:text="${student.active} ? 'Đang học' : 'Bảo lưu'">
                Đang học
            </span>
        </div>

        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Mã sinh viên</dt>
                <dd class="col-sm-9" th:text="${student.studentCode}">SE180001</dd>

                <dt class="col-sm-3">Họ tên</dt>
                <dd class="col-sm-9" th:text="${student.fullName}">Nguyễn Văn A</dd>

                <dt class="col-sm-3">Email</dt>
                <dd class="col-sm-9">
                    <a th:if="${student.email != null and !student.email.isBlank()}"
                       th:href="|mailto:${student.email}|"
                       th:text="${student.email}">a@fpt.edu.vn</a>
                    <span th:unless="${student.email != null and !student.email.isBlank()}"
                          th:text="'Chưa cập nhật'">Chưa cập nhật</span>
                </dd>

                <dt class="col-sm-3">Ngày sinh</dt>
                <dd class="col-sm-9"
                    th:text="|${#temporals.format(student.dateOfBirth, 'dd/MM/yyyy')} (${student.age} tuổi)|">
                    01/01/2004 (22 tuổi)
                </dd>

                <dt class="col-sm-3">Ngành học</dt>
                <dd class="col-sm-9"
                    th:text="|${student.major} - ${majors[student.major] ?: 'Chưa xác định'}|">
                    SE - Kỹ thuật phần mềm
                </dd>

                <dt class="col-sm-3">GPA</dt>
                <dd class="col-sm-9"
                    th:text="|${#numbers.formatDecimal(student.gpa, 1, 2)} / 10|">
                    8.00 / 10
                </dd>

                <dt class="col-sm-3">Xếp loại</dt>
                <dd class="col-sm-9">
                    <span class="badge"
                          th:classappend="${student.rank == 'Xuất sắc'} ? ' text-bg-success' :
                                          (${student.rank == 'Giỏi'} ? ' text-bg-primary' :
                                          (${student.rank == 'Khá'} ? ' text-bg-info' :
                                          (${student.rank == 'Trung bình'} ? ' text-bg-warning' : ' text-bg-danger')))"
                          th:text="${student.rank}">
                        Giỏi
                    </span>
                </dd>

                <dt class="col-sm-3">Học bổng</dt>
                <dd class="col-sm-9"
                    th:text="${student.gpa ge 8.0 and student.active} ?
                             'Đủ điều kiện xét học bổng' :
                             'Không đủ điều kiện'">
                    Đủ điều kiện xét học bổng
                </dd>
            </dl>
        </div>

        <div class="card-footer">
            <a th:href="@{/students}" class="btn btn-secondary">
                ← Quay lại
            </a>
            <a th:href="@{/students/{id}/edit(id=${student.id})}"
               class="btn btn-warning">
                Sửa
            </a>
        </div>
    </div>
</section>
</body>
</html>
