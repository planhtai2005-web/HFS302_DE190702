
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="${student.id == null ? 'Thêm sinh viên' : 'Cập nhật sinh viên'}">
        Form sinh viên
    </title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">

                <div class="card-header">
                    <h4 class="mb-0"
                        th:text="${student.id == null ? 'Thêm sinh viên mới' : 'Cập nhật sinh viên'}">
                        Thêm sinh viên mới
                    </h4>
                </div>

                <div class="card-body">
                    <form th:action="@{/students/save}"
                          th:object="${student}"
                          method="post"
                          novalidate>

                        <input type="hidden" th:field="*{id}"/>

                        <!-- Tổng hợp lỗi validation -->
                        <div class="alert alert-danger"
                             th:if="${#fields.hasErrors('*')}">
                            <strong>Vui lòng kiểm tra lại thông tin:</strong>
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.errors('*')}"
                                    th:text="${err}">
                                    Lỗi nhập liệu
                                </li>
                            </ul>
                        </div>

                        <div class="row g-3">

                            <!-- Mã sinh viên -->
                            <div class="col-md-6">
                                <label for="studentCode" class="form-label">
                                    Mã sinh viên *
                                </label>
                                <input type="text"
                                       id="studentCode"
                                       th:field="*{studentCode}"
                                       th:errorclass="is-invalid"
                                       class="form-control"
                                       placeholder="Ví dụ: SE180001"
                                       maxlength="8"/>
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('studentCode')}"
                                     th:errors="*{studentCode}">
                                    Lỗi mã sinh viên
                                </div>
                            </div>

                            <!-- Họ tên -->
                            <div class="col-md-6">
                                <label for="fullName" class="form-label">
                                    Họ và tên *
                                </label>
                                <input type="text"
                                       id="fullName"
                                       th:field="*{fullName}"
                                       th:errorclass="is-invalid"
                                       class="form-control"
                                       placeholder="Nhập họ và tên"
                                       maxlength="50"/>
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('fullName')}"
                                     th:errors="*{fullName}">
                                    Lỗi họ tên
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="col-12">
                                <label for="email" class="form-label">
                                    Email *
                                </label>
                                <input type="text"
                                       id="email"
                                       th:field="*{email}"
                                       th:errorclass="is-invalid"
                                       class="form-control"
                                       placeholder="student@fpt.edu.vn"/>
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}">
                                    Lỗi email
                                </div>
                            </div>

                            <!-- Ngày sinh -->
                            <div class="col-md-6">
                                <label for="dateOfBirth" class="form-label">
                                    Ngày sinh *
                                </label>
                                <input type="date"
                                       id="dateOfBirth"
                                       th:field="*{dateOfBirth}"
                                       th:errorclass="is-invalid"
                                       class="form-control"/>
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('dateOfBirth')}"
                                     th:errors="*{dateOfBirth}">
                                    Lỗi ngày sinh
                                </div>
                            </div>

                            <!-- GPA -->
                            <div class="col-md-6">
                                <label for="gpa" class="form-label">
                                    GPA (0 - 10) *
                                </label>
                                <input type="number"
                                       id="gpa"
                                       th:field="*{gpa}"
                                       th:errorclass="is-invalid"
                                       class="form-control"
                                       min="0"
                                       max="10"
                                       step="0.01"
                                       placeholder="Ví dụ: 8.50"/>
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('gpa')}"
                                     th:errors="*{gpa}">
                                    Lỗi GPA
                                </div>
                            </div>

                            <!-- Ngành học -->
                            <div class="col-md-6">
                                <label for="major" class="form-label">
                                    Ngành học *
                                </label>
                                <select id="major"
                                        th:field="*{major}"
                                        th:errorclass="is-invalid"
                                        class="form-select">
                                    <option value="">-- Chọn ngành học --</option>
                                    <option value="SE">SE - Kỹ thuật phần mềm</option>
                                    <option value="AI">AI - Trí tuệ nhân tạo</option>
                                    <option value="IA">IA - An toàn thông tin</option>
                                    <option value="GD">GD - Thiết kế đồ họa</option>
                                </select>
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('major')}"
                                     th:errors="*{major}">
                                    Lỗi ngành học
                                </div>
                            </div>

                            <!-- Trạng thái -->
                            <div class="col-md-6 d-flex align-items-center">
                                <div class="form-check mt-4">
                                    <input type="checkbox"
                                           id="active"
                                           th:field="*{active}"
                                           class="form-check-input"/>
                                    <label for="active" class="form-check-label">
                                        Đang học
                                    </label>
                                </div>
                            </div>

                        </div>

                        <hr class="my-4"/>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                Lưu sinh viên
                            </button>
                            <a th:href="@{/students}"
                               class="btn btn-secondary">
                                Hủy
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
