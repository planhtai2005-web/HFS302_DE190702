<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title th:replace="${title}">Student Manager</title>

    <!-- Bootstrap 5 CSS (local) -->
    <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"
          rel="stylesheet"/>

    <!-- Bootstrap Icons (local) -->
    <link th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}"
          rel="stylesheet"/>

    <!-- CSS riêng của project -->
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">

        <a class="navbar-brand" th:href="@{/students}">
            <i class="bi bi-mortarboard-fill me-2"></i>
            Student Manager
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Mở menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <div class="navbar-nav ms-auto">

                <a class="nav-link text-white"
                   th:href="@{/students}">
                    <i class="bi bi-people me-1"></i>
                    Sinh viên
                </a>

                <a class="nav-link text-white"
                   th:href="@{/students/create}">
                    <i class="bi bi-plus-circle me-1"></i>
                    Thêm mới
                </a>

            </div>
        </div>
    </div>
</nav>

<!-- Main content -->
<main class="container">

    <!-- Success message -->
    <div th:if="${successMsg}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${successMsg}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Đóng"></button>
    </div>

    <!-- Error message -->
    <div th:if="${errorMsg}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">

        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${errorMsg}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Đóng"></button>
    </div>

    <!-- Nội dung trang con -->
    <div th:replace="${content}">
        Nội dung trang
    </div>

</main>

<!-- Footer -->
<footer class="text-center text-muted py-4 mt-5 border-top">
    <small>
        HSF302 &copy; 2026 — Spring MVC + Thymeleaf + SQL Server
    </small>
</footer>

<!-- Bootstrap JS (local) -->
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
