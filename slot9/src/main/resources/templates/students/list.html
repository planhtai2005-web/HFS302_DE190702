<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Danh sách sinh viên</title>
</head>

<body>
<section>

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            <i class="bi bi-people-fill me-2"></i>
            Danh sách sinh viên
        </h2>

        <a th:href="@{/students/create}"
           class="btn btn-primary">

            <i class="bi bi-plus-lg me-1"></i>
            Thêm sinh viên

        </a>

    </div>

    <!-- SEARCH -->
    <form th:action="@{/students}"
          method="get"
          class="row g-2 mb-4">

        <div class="col-md-10">

            <input type="text"
                   name="keyword"
                   class="form-control"
                   th:value="${keyword}"
                   placeholder="Tìm theo tên hoặc email..."/>

        </div>

        <div class="col-md-2 d-grid">

            <button type="submit"
                    class="btn btn-outline-primary">

                <i class="bi bi-search me-1"></i>
                Tìm kiếm

            </button>

        </div>

    </form>

    <!-- STUDENT TABLE -->
    <div class="card shadow-sm">

        <div class="card-body p-0">

            <!-- EMPTY -->
            <div th:if="${#lists.isEmpty(students)}"
                 class="text-center p-5 text-muted">

                <i class="bi bi-inbox display-4"></i>

                <p class="mt-2">
                    Không tìm thấy sinh viên nào.
                </p>

                <a th:href="@{/students/create}"
                   class="btn btn-outline-primary">

                    Thêm sinh viên

                </a>

            </div>

            <!-- TABLE -->
            <table th:unless="${#lists.isEmpty(students)}"
                   class="table table-hover mb-0">

                <thead>
                <tr>

                    <th>#</th>
                    <th>ID</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Tuổi</th>
                    <th>Chuyên ngành</th>
                    <th>GPA</th>
                    <th class="text-center">Thao tác</th>

                </tr>
                </thead>

                <tbody>

                <tr th:each="student, stat : ${students}">

                    <!-- STT -->
                    <td th:text="${page.number * page.size + stat.count}">
                        1
                    </td>

                    <!-- ID -->
                    <td th:text="${student.id}">
                        1
                    </td>

                    <!-- NAME -->
                    <td>

                        <a th:href="@{/students/{id}(id=${student.id})}"
                           th:text="${student.name}"
                           class="text-decoration-none fw-semibold">

                            Tên

                        </a>

                    </td>

                    <!-- EMAIL -->
                    <td th:text="${student.email}">
                        email
                    </td>

                    <!-- AGE -->
                    <td th:text="${student.age}">
                        20
                    </td>

                    <!-- MAJOR -->
                    <td>

                        <span class="badge bg-secondary"
                              th:text="${student.major}">

                            CNTT

                        </span>

                    </td>

                    <!-- GPA -->
                    <td>

                        <span th:classappend="${student.gpa >= 3.5} ? 'gpa-high' :
                                              (${student.gpa >= 2.5} ? 'gpa-mid' : 'gpa-low')"
                              th:text="${#numbers.formatDecimal(student.gpa, 1, 1)}">

                            3.5

                        </span>

                    </td>

                    <!-- ACTIONS -->
                    <td class="text-center">

                        <!-- DETAIL -->
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           class="btn btn-sm btn-outline-info me-1"
                           title="Chi tiết">

                            <i class="bi bi-eye"></i>

                        </a>

                        <!-- EDIT -->
                        <a th:href="@{/students/{id}/edit(id=${student.id})}"
                           class="btn btn-sm btn-outline-warning me-1"
                           title="Sửa">

                            <i class="bi bi-pencil"></i>

                        </a>

                        <!-- DELETE -->
                        <form th:action="@{/students/{id}/delete(id=${student.id})}"
                              method="post"
                              class="d-inline"
                              th:data-name="${student.name}"
                              onsubmit="return confirm('Xóa sinh viên ' + this.dataset.name + '?')">

                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger"
                                    title="Xóa">

                                <i class="bi bi-trash"></i>

                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- TOTAL -->
    <div th:if="${page != null}"
         class="text-muted mt-2">

        <small>

            Hiển thị
            <strong th:text="${page.numberOfElements}">
                0
            </strong>
            / tổng
            <strong th:text="${page.totalElements}">
                0
            </strong>
            sinh viên

        </small>

    </div>

    <!-- PAGINATION -->
    <nav th:if="${page != null and page.totalPages > 1}"
         aria-label="Student pagination"
         class="mt-4">

        <ul class="pagination justify-content-center">

            <!-- PREVIOUS -->
            <li class="page-item"
                th:classappend="${page.first} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/students(
                       page=${page.number - 1},
                       size=${size},
                       keyword=${keyword}
                   )}">
                    <i class="bi bi-chevron-left"></i>
                </a>

            </li>

            <!-- PAGE NUMBERS -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">

                <a class="page-link"
                   th:href="@{/students(
                       page=${i},
                       size=${size},
                       keyword=${keyword}
                   )}"
                   th:text="${i + 1}">

                    1

                </a>

            </li>

            <!-- NEXT -->
            <li class="page-item"
                th:classappend="${page.last} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/students(
                       page=${page.number + 1},
                       size=${size},
                       keyword=${keyword}
                   )}">
                    <i class="bi bi-chevron-right"></i>
                </a>

            </li>

        </ul>

    </nav>

</section>
</body>
</html>
