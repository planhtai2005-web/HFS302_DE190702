<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>Danh sách sinh viên</title>
</head>

<body>

<section>

    <!-- =========================
         HEADER
         ========================= -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            <i class="bi bi-people-fill me-2"></i>
            Danh sách sinh viên
        </h2>

        <a th:href="@{/students/create}"
           class="btn btn-primary">

            <i class="bi bi-plus-lg me-1"></i>
            Thêm sinh viên

        </a>

    </div>


    <!-- =========================
         SEARCH
         ========================= -->
    <form th:action="@{/students}"
          method="get"
          class="row g-2 mb-4">

        <div class="col-md-10">

            <input type="text"
                   name="keyword"
                   class="form-control"
                   th:value="${keyword}"
                   placeholder="Tìm theo tên hoặc email..."/>

        </div>

        <!-- Giữ sort khi search -->
        <input type="hidden"
               name="sort"
               th:value="${sort}"/>

        <input type="hidden"
               name="size"
               th:value="${size}"/>

        <div class="col-md-2 d-grid">

            <button type="submit"
                    class="btn btn-outline-primary">

                <i class="bi bi-search me-1"></i>
                Tìm kiếm

            </button>

        </div>

    </form>


    <!-- =========================
         TABLE
         ========================= -->
    <div class="card shadow-sm">

        <div class="card-body p-0">


            <!-- Không có dữ liệu -->
            <div th:if="${#lists.isEmpty(students)}"
                 class="text-center p-5 text-muted">

                <i class="bi bi-inbox display-4"></i>

                <p class="mt-2">
                    Không tìm thấy sinh viên nào.
                </p>

                <a th:href="@{/students/create}"
                   class="btn btn-outline-primary">

                    Thêm sinh viên

                </a>

            </div>


            <!-- Có dữ liệu -->
            <table th:unless="${#lists.isEmpty(students)}"
                   class="table table-hover mb-0">

                <thead>

                <tr>

                    <!-- =========================
                         #
                         ========================= -->
                    <th>
                        #
                    </th>


                    <!-- =========================
                         ID
                         ========================= -->
                    <th>

                        <a th:href="@{/students(
                                page=0,
                                size=${size},
                                keyword=${keyword},
                                sort='id,asc'
                           )}"
                           class="text-decoration-none text-dark">

                            ID

                            <i class="bi bi-arrow-down-up ms-1"></i>

                        </a>

                    </th>


                    <!-- =========================
                         HỌ TÊN
                         ========================= -->
                    <th>

                        <a th:href="@{/students(
                                page=0,
                                size=${size},
                                keyword=${keyword},
                                sort='name,asc'
                           )}"
                           class="text-decoration-none text-dark">

                            Họ tên

                            <i class="bi bi-arrow-down-up ms-1"></i>

                        </a>

                    </th>


                    <!-- =========================
                         EMAIL
                         ========================= -->
                    <th>

                        <a th:href="@{/students(
                                page=0,
                                size=${size},
                                keyword=${keyword},
                                sort='email,asc'
                           )}"
                           class="text-decoration-none text-dark">

                            Email

                            <i class="bi bi-arrow-down-up ms-1"></i>

                        </a>

                    </th>


                    <!-- =========================
                         TUỔI
                         ========================= -->
                    <th>

                        <a th:href="@{/students(
                                page=0,
                                size=${size},
                                keyword=${keyword},
                                sort='age,asc'
                           )}"
                           class="text-decoration-none text-dark">

                            Tuổi

                            <i class="bi bi-arrow-down-up ms-1"></i>

                        </a>

                    </th>


                    <!-- =========================
                         CHUYÊN NGÀNH
                         ========================= -->
                    <th>

                        <a th:href="@{/students(
                                page=0,
                                size=${size},
                                keyword=${keyword},
                                sort='major,asc'
                           )}"
                           class="text-decoration-none text-dark">

                            Chuyên ngành

                            <i class="bi bi-arrow-down-up ms-1"></i>

                        </a>

                    </th>


                    <!-- =========================
                         GPA
                         ========================= -->
                    <th>

                        <a th:href="@{/students(
                                page=0,
                                size=${size},
                                keyword=${keyword},
                                sort='gpa,desc'
                           )}"
                           class="text-decoration-none text-dark">

                            GPA

                            <i class="bi bi-sort-down ms-1"></i>

                        </a>

                    </th>


                    <!-- =========================
                         ACTION
                         ========================= -->
                    <th class="text-center">
                        Thao tác
                    </th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="student, stat : ${students}">


                    <!-- STT -->
                    <td th:text="${page.number * page.size + stat.count}">
                        1
                    </td>


                    <!-- ID -->
                    <td th:text="${student.id}">
                        1
                    </td>


                    <!-- NAME -->
                    <td>

                        <a th:href="@{/students/{id}(id=${student.id})}"
                           th:text="${student.name}"
                           class="text-decoration-none fw-semibold">

                            Tên

                        </a>

                    </td>


                    <!-- EMAIL -->
                    <td th:text="${student.email}">
                        email
                    </td>


                    <!-- AGE -->
                    <td th:text="${student.age}">
                        20
                    </td>


                    <!-- MAJOR -->
                    <td>

                        <span class="badge bg-secondary"
                              th:text="${student.major.code + ' - ' + student.major.name}">

                            CNTT - Công nghệ thông tin

                        </span>

                    </td>


                    <!-- GPA -->
                    <td>

                        <span th:classappend="${student.gpa >= 3.5} ? 'gpa-high' :
                                              (${student.gpa >= 2.5} ? 'gpa-mid' : 'gpa-low')"
                              th:text="${#numbers.formatDecimal(student.gpa, 1, 1)}">

                            3.5

                        </span>

                    </td>


                    <!-- ACTION -->
                    <td class="text-center">

                        <!-- DETAIL -->
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           class="btn btn-sm btn-outline-info me-1"
                           title="Chi tiết">

                            <i class="bi bi-eye"></i>

                        </a>


                        <!-- EDIT -->
                        <a th:href="@{/students/{id}/edit(id=${student.id})}"
                           class="btn btn-sm btn-outline-warning me-1"
                           title="Sửa">

                            <i class="bi bi-pencil"></i>

                        </a>


                        <!-- DELETE -->
                        <form th:action="@{/students/{id}/delete(id=${student.id})}"
                              method="post"
                              class="d-inline"
                              th:data-name="${student.name}"
                              onsubmit="return confirm('Xóa sinh viên ' + this.dataset.name + '?')">

                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger"
                                    title="Xóa">

                                <i class="bi bi-trash"></i>

                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- =========================
         RESULT COUNT
         ========================= -->
    <div th:if="${page != null}"
         class="text-muted mt-2">

        <small>

            Hiển thị

            <strong th:text="${page.numberOfElements}">
                0
            </strong>

            / tổng

            <strong th:text="${page.totalElements}">
                0
            </strong>

            sinh viên

        </small>

    </div>


    <!-- =========================
         PAGINATION
         ========================= -->
    <nav th:if="${page != null and page.totalPages > 1}"
         aria-label="Student pagination"
         class="mt-4">

        <ul class="pagination justify-content-center">


            <!-- PREVIOUS -->
            <li class="page-item"
                th:classappend="${page.first} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/students(
                       page=${page.number - 1},
                       size=${size},
                       keyword=${keyword},
                       sort=${sort}
                   )}">

                    <i class="bi bi-chevron-left"></i>

                </a>

            </li>


            <!-- PAGE NUMBER -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">

                <a class="page-link"
                   th:href="@{/students(
                       page=${i},
                       size=${size},
                       keyword=${keyword},
                       sort=${sort}
                   )}"
                   th:text="${i + 1}">

                    1

                </a>

            </li>


            <!-- NEXT -->
            <li class="page-item"
                th:classappend="${page.last} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/students(
                       page=${page.number + 1},
                       size=${size},
                       keyword=${keyword},
                       sort=${sort}
                   )}">

                    <i class="bi bi-chevron-right"></i>

                </a>

            </li>

        </ul>

    </nav>

</section>

</body>
</html>
