<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Chi tiết sinh viên</title>
</head>
<body>
<section layout:fragment="content">
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <!-- TODO 14.1: Ghép mã và họ tên -->
            <h4 class="mb-0"
                th:text="|${student.studentCode} - ${student.fullName}|">
            </h4>

            <!-- TODO 14.2: Màu và nội dung theo trạng thái -->
            <span class="badge"
                  th:classappend="${student.active}
                      ? 'text-bg-success' : 'text-bg-secondary'"
                  th:text="${student.active} ? 'Đang học' : 'Nghỉ học'">
            </span>
        </div>

        <div class="card-body">
            <!-- TODO 14.3 -->
            <dl class="row mb-0">
                <dt class="col-sm-3">Mã sinh viên</dt>
                <dd class="col-sm-9"
                    th:text="${student.studentCode}"></dd>

                <dt class="col-sm-3">Họ tên</dt>
                <dd class="col-sm-9"
                    th:text="${student.fullName}"></dd>

                <dt class="col-sm-3">Email</dt>
                <dd class="col-sm-9">
                    <a th:if="${student.email != null}"
                       th:href="|mailto:${student.email}|"
                       th:text="${student.email}"></a>
                    <span th:if="${student.email == null}"
                          th:text="${student.email ?: 'Chưa cập nhật'}">
                    </span>
                </dd>

                <dt class="col-sm-3">Ngày sinh</dt>
                <dd class="col-sm-9"
                    th:text="|${#temporals.format(student.dateOfBirth, 'dd/MM/yyyy')} (${student.age} tuổi)|">
                </dd>

                <dt class="col-sm-3">Ngành</dt>
                <dd class="col-sm-9"
                    th:text="|${student.major} - ${majors[student.major]}|">
                </dd>

                <dt class="col-sm-3">GPA</dt>
                <dd class="col-sm-9"
                    th:text="|${#numbers.formatDecimal(student.gpa, 1, 2)} / 10|">
                </dd>

                <dt class="col-sm-3">Xếp loại</dt>
                <dd class="col-sm-9"
                    th:text="${student.rank}"></dd>

                <dt class="col-sm-3">Học bổng</dt>
                <dd class="col-sm-9"
                    th:text="${student.gpa ge 8.0 and student.active}
                        ? 'Đủ điều kiện xét học bổng'
                        : 'Không đủ điều kiện'">
                </dd>
            </dl>

            <!-- TODO 14.4: Bonus dùng selection expression -->
            <div class="mt-3" th:object="${student}">
                <h6>Thông tin dùng *{...}</h6>
                <p>
                    Họ tên:
                    <span th:text="*{fullName}"></span>
                </p>
                <p>
                    Email:
                    <span th:text="*{email ?: 'Chưa cập nhật'}"></span>
                </p>
            </div>
        </div>

        <!-- TODO 14.5 -->
        <div class="card-footer">
            <a th:href="@{/students}"
               class="btn btn-secondary">← Quay lại</a>

            <a th:href="@{/students/{id}/edit(id=${student.id})}"
               class="btn btn-warning">Sửa</a>
        </div>
    </div>
</section>
</body>
</html>
