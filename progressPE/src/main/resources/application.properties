spring.application.name=SE20A10_DE190702_SDM_PE

server.port=8080
server.servlet.context-path=/

# MS SQL Server connection (sa/sa as required by the exam Q5.4)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HSF302_2026_PE_SDM;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Tables are created by the SQL script, so ddl-auto must stay none
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
