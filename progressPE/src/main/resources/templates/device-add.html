<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add New Device</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-light text-dark">
<div class="container my-4" style="max-width: 800px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="mb-3">Add New Device</h2>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/add}" th:object="${DeviceDTO}" method="post" novalidate="novalidate">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="deviceCode" class="form-label fw-bold">Device Code:</label>
                        <input type="text" class="form-control" id="deviceCode" th:field="*{deviceCode}">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('deviceCode')}" th:errors="*{deviceCode}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="categoryId" class="form-label fw-bold">Category:</label>
                        <select class="form-select" id="categoryId" th:field="*{categoryId}">
                            <option value="">-- Select category --</option>
                            <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="deviceName" class="form-label fw-bold">Device Name:</label>
                        <input type="text" class="form-control" id="deviceName" th:field="*{deviceName}">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('deviceName')}" th:errors="*{deviceName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="price" class="form-label fw-bold">Price ($):</label>
                        <input type="text" class="form-control" id="price" th:field="*{price}">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="warrantyMonths" class="form-label fw-bold">Warranty (months):</label>
                        <input type="text" class="form-control" id="warrantyMonths" th:field="*{warrantyMonths}">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('warrantyMonths')}" th:errors="*{warrantyMonths}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="installationDate" class="form-label fw-bold">Installation Date (dd/MM/yyyy):</label>
                        <input type="text" class="form-control" id="installationDate" placeholder="dd/MM/yyyy" th:field="*{installationDate}">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('installationDate')}" th:errors="*{installationDate}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="status" class="form-label fw-bold">Status:</label>
                        <select class="form-select" id="status" th:field="*{status}">
                            <option th:each="s : ${statuses}" th:value="${s.key}" th:text="${s.value}"></option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                        <div class="form-text">(AC-Active, IN-Inactive, DR-Draft)</div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a th:href="@{/}" class="btn btn-outline-primary">Back</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
